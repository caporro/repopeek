[package]
name = "repopeek"
version = "0.1.0"
description = "Controllo repository Git, staging e commit. Locale, macOS."
edition = "2021"
default-run = "repopeek"

[lib]
name = "repopeek_core"

[[bin]]
name = "repopeek"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "repopeek-test-driver"
path = "src/bin/test-driver.rs"
required-features = ["test-driver"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog"]
test-driver = []
smoke = ["desktop"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
